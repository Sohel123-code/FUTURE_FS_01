  <!-- Custom CSS -->
  <style type="text/tailwindcss">
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* Custom Colors */
    :root {
      --background: 240 10% 99%;
      --foreground: 222 47% 11%;
      --card: 0 0% 100%;
      --card-foreground: 222 47% 11%;
      --primary: 188 84% 48%;
      --primary-foreground: 0 0% 100%;
      --secondary: 35 92% 55%;
      --secondary-foreground: 222 47% 11%;
    }

    .dark {
      --background: 0 0% 0%;
      --foreground: 0 0% 100%;
      --card: 0 0% 5%;
      --card-foreground: 0 0% 100%;
      --primary: 188 78% 58%;
      --primary-foreground: 0 0% 0%;
      --secondary: 35 85% 65%;
      --secondary-foreground: 0 0% 0%;
    }

    .bg-background { background-color: hsl(var(--background)); }
    .text-foreground { color: hsl(var(--foreground)); }
    .bg-card { background-color: hsl(var(--card)); }
    .text-card-foreground { color: hsl(var(--card-foreground)); }
    .bg-primary { background-color: hsl(var(--primary)); }
    .text-primary { color: hsl(var(--primary)); }
    .text-primary-foreground { color: hsl(var(--primary-foreground)); }
    .bg-secondary { background-color: hsl(var(--secondary)); }
    .text-secondary { color: hsl(var(--secondary)); }
    .text-secondary-foreground { color: hsl(var(--secondary-foreground)); }

    /* ── Page transition ───────────────────────────────────────────────────── */
    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .page-enter {
      animation: pageFadeIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* ── Scroll reveal ─────────────────────────────────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.75s cubic-bezier(0.17, 0.55, 0.55, 1),
                  transform 0.75s cubic-bezier(0.17, 0.55, 0.55, 1);
    }
    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-left {
      opacity: 0;
      transform: translateX(-40px);
      transition: opacity 0.75s cubic-bezier(0.17, 0.55, 0.55, 1),
                  transform 0.75s cubic-bezier(0.17, 0.55, 0.55, 1);
    }
    .reveal-left.active {
      opacity: 1;
      transform: translateX(0);
    }
    .reveal-right {
      opacity: 0;
      transform: translateX(40px);
      transition: opacity 0.75s cubic-bezier(0.17, 0.55, 0.55, 1),
                  transform 0.75s cubic-bezier(0.17, 0.55, 0.55, 1);
    }
    .reveal-right.active {
      opacity: 1;
      transform: translateX(0);
    }

    /* ── Certificate card fade-in ──────────────────────────────────────────── */
    @keyframes certCardFadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .cert-card {
      animation: certCardFadeIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* ── Navbar underline ──────────────────────────────────────────────────── */
    .nav-link::after {
      content: '';
      display: block;
      width: 0;
      height: 2px;
      background: hsl(var(--primary));
      transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      border-radius: 2px;
    }
    .nav-link:hover::after,
    .nav-link.active::after {
      width: 100%;
    }

    /* ── Navbar scroll shadow ──────────────────────────────────────────────── */
    .nav-scrolled {
      box-shadow: 0 4px 24px -4px rgba(0,0,0,0.12);
      border-bottom: 1px solid hsl(var(--primary) / 0.12);
    }

    /* ── Floating background orbs ──────────────────────────────────────────── */
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(-24px) scale(1.06); }
    }
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: floatOrb var(--dur, 8s) ease-in-out infinite;
    }
    .orb-1 {
      width: 380px; height: 380px;
      background: hsl(var(--primary) / 0.12);
      top: -80px; left: -80px;
      --dur: 9s;
    }
    .orb-2 {
      width: 280px; height: 280px;
      background: hsl(var(--secondary) / 0.10);
      bottom: 10%; right: -60px;
      --dur: 11s;
      animation-delay: -3s;
    }
    .orb-3 {
      width: 200px; height: 200px;
      background: hsl(var(--primary) / 0.07);
      top: 40%; left: 55%;
      --dur: 13s;
      animation-delay: -6s;
    }

    /* ── Shimmer button ────────────────────────────────────────────────────── */
    @keyframes shimmer {
      from { transform: translateX(-100%); }
      to   { transform: translateX(100%); }
    }
    .shimmer-btn {
      position: relative;
      overflow: hidden;
    }
    .shimmer-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.25) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: none;
    }
    .shimmer-btn:hover::after {
      animation: shimmer 0.65s ease forwards;
    }

    /* ── Floating badge pulse ──────────────────────────────────────────────── */
    @keyframes badgePulse {
      0%, 100% { box-shadow: 0 0 0 0 hsl(var(--primary) / 0.4); }
      50%       { box-shadow: 0 0 0 8px hsl(var(--primary) / 0); }
    }
    .badge-pulse {
      animation: badgePulse 2.5s ease-in-out infinite;
    }

    /* ── Staggered grid card pop-in ────────────────────────────────────────── */
    @keyframes cardPopIn {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card-pop {
      animation: cardPopIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* ── Gradient text animation ───────────────────────────────────────────── */
    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .gradient-text-animate {
      background: linear-gradient(270deg, hsl(var(--primary)), hsl(var(--secondary)), hsl(var(--primary)));
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 4s ease infinite;
    }

    /* ── Smooth hover lift ─────────────────────────────────────────────────── */
    .hover-lift {
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .hover-lift:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px -8px rgba(0,0,0,0.15);
    }

    .hover-shadow:hover {
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      transform: translateY(-5px);
      transition: all 0.3s ease-in-out;
    }
  </style>

            }
          }
        }
      }
    }
  </script>
</head>
